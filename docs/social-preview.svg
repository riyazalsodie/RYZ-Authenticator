<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Dark App Theme Ambient Glows -->
    <radialGradient id="neonGlowCenter" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#003318" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="neonGlowTopLeft" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- App Card Gradient & Borders -->
