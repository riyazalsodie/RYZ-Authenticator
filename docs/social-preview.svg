<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background & Card Gradients -->
    <radialGradient id="bgGlow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#022c22" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>

  <!-- Deep Backdrop -->
  <rect width="1280" height="640" fill="#030712"/>
  <rect width="1280" height="640" fill="url(#bgGlow)"/>
  <rect width="1280" height="640" fill="url(#cyanGlow)"/>

  <!-- Subtle Matrix Grid -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
    <line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1120" y1="0" x2="1120" y2="640"/>
  </g>

  <!-- Glowing Center Accent Line -->
  <rect x="140" y="38" width="1000" height="1" fill="url(#accentLine)"/>

  <!-- LEFT HERO SECTION -->
  <!-- Top Badge -->
  <g transform="translate(90, 80)">
    <rect width="210" height="34" rx="17" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#34d399"/>
    <text x="35" y="22" fill="#a7f3d0" font-size="13" font-weight="700" letter-spacing="1.2" class="font-mono">OPEN SOURCE · v1.1.0</text>
  </g>

  <!-- Title & Branding -->
  <g transform="translate(90, 175)">
    <text fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1.5" class="font-sans">
      RYZ Authenticator
    </text>
    <text y="48" fill="#10b981" font-size="20" font-weight="700" letter-spacing="2.5" class="font-mono">
      ZERO-KNOWLEDGE 2FA / TOTP ENGINE
    </text>
  </g>

  <!-- Description -->
  <g transform="translate(90, 275)">
    <text fill="#94a3b8" font-size="19" font-weight="400" line-height="28" class="font-sans">
      <tspan x="0" dy="0">Hardware-grade, multi-platform authenticator engineered with</tspan>
      <tspan x="0" dy="28">Rust &amp; Tauri v2. Local AES-256-GCM vault, live camera scanner,</tspan>
      <tspan x="0" dy="28">and 1-click Google Authenticator QR batch migration.</tspan>
    </text>
  </g>

  <!-- Platform Pills -->
  <g transform="translate(90, 395)">
    <!-- Windows -->
    <g transform="translate(0, 0)">
      <rect width="112" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="56" y="23" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">🪟 Windows</text>
    </g>
    <!-- macOS -->
    <g transform="translate(122, 0)">
      <rect width="102" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="51" y="23" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">🍎 macOS</text>
    </g>
    <!-- Linux -->
    <g transform="translate(234, 0)">
      <rect width="96" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="48" y="23" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">🐧 Linux</text>
    </g>
    <!-- Android -->
    <g transform="translate(340, 0)">
      <rect width="106" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="53" y="23" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">🤖 Android</text>
    </g>
    <!-- iOS -->
    <g transform="translate(456, 0)">
      <rect width="84" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="42" y="23" fill="#cbd5e1" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">📱 iOS</text>
    </g>
  </g>

  <!-- Author Tag -->
  <g transform="translate(90, 520)">
    <text fill="#64748b" font-size="15" font-weight="500" class="font-mono">Built by <tspan fill="#34d399" font-weight="700">R ! Y 4 Z</tspan> · MIT License · Zero Telemetry</text>
  </g>


  <!-- RIGHT FLOATING INTERFACE CARD (MOCKUP) -->
  <g transform="translate(730, 95)" filter="url(#cardShadow)">
    <!-- Container Shell -->
    <rect width="460" height="450" rx="20" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.8"/>

    <!-- App Header Inside Card -->
    <g transform="translate(24, 26)">
      <!-- App Icon -->
      <g filter="url(#shadowGlow)">
        <rect width="44" height="44" rx="12" fill="url(#shieldGrad)"/>
        <!-- Shield SVG Path -->
        <path d="M22 10 L33 15 V23 C33 30 22 35 22 35 C22 35 11 30 11 23 V15 Z" fill="#ffffff" opacity="0.9"/>
      </g>
      <text x="56" y="24" fill="#ffffff" font-size="17" font-weight="800" class="font-sans">RYZ Authenticator</text>
      <text x="56" y="40" fill="#10b981" font-size="12" font-weight="600" class="font-mono">AES-256-GCM LOCKED</text>

      <!-- Sync Status Badge -->
      <rect x="330" y="8" width="76" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <circle cx="344" cy="21" r="3.5" fill="#34d399"/>
      <text x="354" y="25" fill="#a7f3d0" font-size="11" font-weight="700" class="font-mono">SYNC</text>
    </g>

    <!-- Divider Line -->
    <line x1="24" y1="92" x2="436" y2="92" stroke="#1f2937" stroke-width="1"/>

    <!-- Account Card 1: GitHub -->
    <g transform="translate(24, 112)">
      <rect width="412" height="88" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="34" cy="36" r="16" fill="#1e293b"/>
      <text x="34" y="42" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle" class="font-sans">🐙</text>
      <text x="62" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="font-sans">GitHub</text>
      <text x="62" y="48" fill="#64748b" font-size="12" class="font-sans">riyazalsodie</text>
      
      <!-- Big OTP Digits -->
      <text x="62" y="74" fill="#34d399" font-size="25" font-weight="800" letter-spacing="4" class="font-mono">842 190</text>
      
      <!-- Circular Progress Ring (Simulated) -->
      <circle cx="376" cy="44" r="14" fill="none" stroke="#1e293b" stroke-width="3"/>
      <circle cx="376" cy="44" r="14" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="88" stroke-dashoffset="24"/>
      <text x="376" y="48" fill="#10b981" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">22</text>
    </g>

    <!-- Account Card 2: AWS Root -->
    <g transform="translate(24, 214)">
      <rect width="412" height="88" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="34" cy="36" r="16" fill="#1e293b"/>
      <text x="34" y="42" fill="#f59e0b" font-size="16" font-weight="700" text-anchor="middle" class="font-sans">☁️</text>
      <text x="62" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="font-sans">AWS Production</text>
      <text x="62" y="48" fill="#64748b" font-size="12" class="font-sans">root@infra.cloud</text>
      
      <text x="62" y="74" fill="#38bdf8" font-size="25" font-weight="800" letter-spacing="4" class="font-mono">319 705</text>
      
      <circle cx="376" cy="44" r="14" fill="none" stroke="#1e293b" stroke-width="3"/>
      <circle cx="376" cy="44" r="14" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="88" stroke-dashoffset="60"/>
      <text x="376" y="48" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">08</text>
    </g>

    <!-- Account Card 3: Cloudflare -->
    <g transform="translate(24, 316)">
      <rect width="412" height="88" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="34" cy="36" r="16" fill="#1e293b"/>
      <text x="34" y="42" fill="#f97316" font-size="16" font-weight="700" text-anchor="middle" class="font-sans">🛡️</text>
      <text x="62" y="32" fill="#f8fafc" font-size="15" font-weight="700" class="font-sans">Cloudflare Edge</text>
      <text x="62" y="48" fill="#64748b" font-size="12" class="font-sans">admin@ryz.network</text>
      
      <text x="62" y="74" fill="#cbd5e1" font-size="25" font-weight="800" letter-spacing="4" class="font-mono">604 883</text>
      
      <circle cx="376" cy="44" r="14" fill="none" stroke="#1e293b" stroke-width="3"/>
      <circle cx="376" cy="44" r="14" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="88" stroke-dashoffset="15"/>
      <text x="376" y="48" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">26</text>
    </g>

    <!-- Card Bottom Feature Badges -->
    <g transform="translate(24, 418)">
      <text fill="#64748b" font-size="12" font-weight="600" class="font-mono">⚡ 6s Delete Guard · 📷 Live QR Scanner · 🔒 RFC 4648</text>
    </g>
  </g>
</svg>