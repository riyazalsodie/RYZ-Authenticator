[package]
name = "ryz-authenticator"
version = "1.1.0"
description = "Fast, Open-Source, Zero-Knowledge 2FA & TOTP Authenticator for Windows, macOS, Linux, Android & iOS (Authy Desktop Alternative)"
authors = ["R ! Y 4 Z"]
license = "MIT"
repository = "https://github.com/riyazalsodie/RYZ-Authenticator"
homepage = "https://github.com/riyazalsodie/RYZ-Authenticator"
keywords = ["2fa", "totp", "authenticator", "tauri", "cryptography"]
categories = ["cryptography", "authentication", "gui", "command-line-utilities"]
edition = "2021"

[lib]
name = "ryz_auth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-notification = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }


# Cryptographic and Security Primitives
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["derive"] }
secrecy = { version = "0.8", features = ["serde"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.5"
data-encoding = "2.5"
rand = "0.8"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
window-vibrancy = "0.8.1"

# Windows Specific Integrations
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Security_Credentials",
] }



